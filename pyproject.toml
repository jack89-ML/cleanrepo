[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanrepo"
version = "0.1.0"
description = "Deterministic pre-publish OPSEC scanner: secret patterns, entropy checks, path sanitization and git history inspection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cleanrepo contributors" }]
keywords = ["opsec", "secret-scanning", "leak-prevention", "git", "pre-commit", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
cleanrepo = "cleanrepo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
