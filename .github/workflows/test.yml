name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Self-scan (no findings expected)
        run: |
          python -m cleanrepo.cli scan . --json | python -c \
            "import json,sys; d=json.load(sys.stdin); print('findings:', d['findings_count']); sys.exit(1 if d['findings_count'] else 0)"
